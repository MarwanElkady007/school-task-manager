{% load static %}
<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - School Task Assignment</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}" />
  </head>
  <body>
    <header>
      <nav id="navbar">
        
        <ul>
          <li><a href="{% url 'home' %}">Home</a></li>
          <li><a href="{% url 'signup' %}">Sign Up</a></li>
          <li><a href="{% url 'login' %}">Login</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h2>Sign Up</h2>
      
<div id="alertContainer">
  {% if messages %}
    {% for message in messages %}
      <div class="popup-alert alert-{{ message.tags }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
</div>
      <form method="post" >
        {% csrf_token %}
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />

        <label for="confirm_password">Confirm Password:</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          required
        />

<fieldset>
  <legend>User Type</legend>
  <label>
    <input type="radio" name="user_type" value="admin" required /> Admin
  </label>
  <label>
    <input type="radio" name="user_type" value="teacher" /> Teacher
  </label>
</fieldset>

        <button type="submit">Sign Up</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2025 School Task Assignment</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
